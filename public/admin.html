<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Mix Família GC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<div class="page">

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="assets/logo.png" alt="Mix Família GC" />
    <h1>MIX<span>FAMÍLIA GC</span></h1>
  </div>
  <nav class="tabs">
    <a class="tab-btn" href="/">Voltar ao site</a>
  </nav>
  <div class="topbar-right">
    <span id="save-state" class="save-state"></span>
    <button id="btn-logout" class="btn-connect hidden" type="button">Sair</button>
  </div>
</header>

<main>

  <!-- Tela de senha -->
  <section id="tela-login" class="tab-panel active login-wrap hidden">
    <div class="login-box">
      <h2>Painel de rankings</h2>
      <p class="muted">Digite a senha de admin para editar os níveis dos jogadores.</p>
      <input id="input-senha" class="search-input" type="password" placeholder="Senha" autocomplete="current-password" />
      <button id="btn-login" class="btn btn-primary" type="button">Entrar</button>
      <div id="login-msg" class="msg"></div>
    </div>
  </section>

  <!-- Painel -->
  <section id="tela-painel" class="tab-panel active hidden">
    <div class="section-head">
      <h2>Rankings dos jogadores</h2>
      <p class="muted">
        Rank 1 é o mais forte e rank 5 o mais fraco. Cada nível aceita quantos jogadores você quiser.
        As mudanças só valem depois de clicar em salvar.
      </p>
    </div>

    <div class="admin-actions">
      <div class="admin-add">
        <input id="input-busca" class="search-input" type="text" placeholder="Buscar na base do servidor, ou colar link da Steam…" />
        <select id="select-tier-novo" class="season-select" title="Nível do jogador adicionado">
          <option value="1">Rank 1</option>
          <option value="2">Rank 2</option>
          <option value="3" selected>Rank 3</option>
          <option value="4">Rank 4</option>
          <option value="5">Rank 5</option>
        </select>
      </div>
      <div id="resultado-busca" class="resultado-busca hidden"></div>
    </div>

    <div id="rankings" class="rankings-grid"></div>

    <div class="sorteio-controls admin-save-bar">
      <span id="admin-contagem" class="selected-count">0 jogadores</span>
      <button id="btn-salvar" class="btn btn-primary" type="button" disabled>Salvar alterações</button>
    </div>

    <div id="admin-msg" class="msg"></div>
  </section>

</main>

</div>

<script src="admin.js"></script>
</body>
</html>
